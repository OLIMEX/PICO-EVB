esphome:
  name: pico-w-relay-board
  friendly_name: Pico W Relay Board
  on_boot:
    priority: 600
    then:
      - switch.turn_off: relay1
      - switch.turn_off: relay2
      - switch.turn_off: relay3
      - switch.turn_off: relay4
  on_shutdown:
    then:
      - switch.turn_off: relay1
      - switch.turn_off: relay2
      - switch.turn_off: relay3
      - switch.turn_off: relay4

rp2040:
  board: rpipicow

logger:

api:
  encryption:
    key: !secret api_key
  on_client_disconnected:
    then:
      - switch.turn_off: relay1
      - switch.turn_off: relay2
      - switch.turn_off: relay3
      - switch.turn_off: relay4

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Pico-W-Fallback"
    password: !secret fallback_password

# UART on GPIO0 (TX) / GPIO1 (RX)
uart:
  tx_pin: GPIO0
  rx_pin: GPIO1
  baud_rate: 9600

# I2C on GPIO16 (SDA) / GPIO17 (SCL)
i2c:
  sda: GPIO16
  scl: GPIO17
  scan: true

# SPI on GPIO4-7
spi:
  miso_pin: GPIO4
  clk_pin: GPIO6
  mosi_pin: GPIO7

# --- INPUTS ---
# Active-low with asymmetric debounce:
#   0 held for >5ms  → reports ON
#   1 held for >60ms → reports OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    name: "Input 1"
    id: input1
    filters:
      - delayed_on: 5ms
      - delayed_off: 60ms

  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    name: "Input 2"
    id: input2
    filters:
      - delayed_on: 5ms
      - delayed_off: 60ms

  - platform: gpio
    pin:
      number: GPIO8
      mode: INPUT_PULLUP
      inverted: true
    name: "Input 3"
    id: input3
    filters:
      - delayed_on: 5ms
      - delayed_off: 60ms

  - platform: gpio
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    name: "Input 4"
    id: input4
    filters:
      - delayed_on: 5ms
      - delayed_off: 60ms

# --- RELAYS ---
# All initialize OFF, active-high drive assumed.
# Change inverted: true if your relay module is active-low.

switch:
  - platform: gpio
    pin:
      number: GPIO10
    name: "Relay 1"
    id: relay1
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin:
      number: GPIO11
    name: "Relay 2"
    id: relay2
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin:
      number: GPIO12
    name: "Relay 3"
    id: relay3
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin:
      number: GPIO13
    name: "Relay 4"
    id: relay4
    restore_mode: ALWAYS_OFF
